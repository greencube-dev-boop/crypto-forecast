[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-forecast"
version = "0.1.0"
description = "Multi-Horizon Cryptocurrency Price Forecasting System and Interactive Colab Web GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "requests>=2.31.0",
    "yfinance>=0.2.36",
    "feedparser>=6.0.10",
    "gradio>=4.20.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
